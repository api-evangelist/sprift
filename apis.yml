apis:
- aid: sprift:sprift-data-and-api-v2
  name: Sprift Data and API (v2, advertised)
  description: >-
    The API family Sprift advertises on its Data and API product page, recorded here as advertised and
    NOT as verified. The page names ten REST endpoint paths — /api/v2/property/{uprn} (300 data point
    profile), /api/v2/comparables (whole-of-market sold evidence), /api/v2/prospect/search (off-market
    owners likely to sell), /api/v2/watch (Property Watch, described as real-time webhook alerts on listed,
    sold, price reduced, planning submitted and EPC updated), /api/v2/risk/{uprn} (flood, subsidence,
    radon, contaminated land, coastal erosion), /api/v2/planning/{uprn}, /api/v2/market/insight, /api/v2/epc/{uprn}
    and /api/v2/bulk (up to 500 properties per call) — plus six data products: Automated Valuation, Sprift
    Insights natural-language querying, custom datasets, bulk data feeds, Property Watch and a National
    Comparables Library. No machine-readable contract is published for any of them: the only spec Sprift
    serves is the v1 Swagger document, which contains none of these paths. No host was confirmed either
    — the advertised paths are given host-relative, https://sprift.com/api/v2/property/{uprn} returns
    HTTP 404, and https://api.sprift.com answers every path with HTTP 403 MissingAuthenticationTokenException
    from an AWS API Gateway, which proves an API gateway exists on that name but documents nothing. No
    baseURL is asserted here for that reason. The page states authentication is a Bearer token (sk_live_sprift_
    prefix) generated from Settings then Developer then API Keys, which contradicts both the SPRIFT-API-KEY
    header in the published contract and Sprift's own knowledge base instruction to email Customer Success
    for access.
  humanURL: https://sprift.com/data-and-api
