aid: sprift
url: https://raw.githubusercontent.com/api-evangelist/sprift/refs/heads/main/apis.yml
name: Sprift
kind: company
description: >-
  Sprift is a United Kingdom property data aggregator, operated by Sprift
  Technologies Ltd and founded in 2016 by Matt Gilpin, that assembles up to 300
  data points on more than 30 million UK residential properties from public and
  private sources — Royal Mail, Ordnance Survey, the Environment Agency, HM Land
  Registry, Ofcom, Historic England, Ofsted, Google Maps, the Valuation Office
  Agency and the ONS — and links every one of them to a UPRN, the UK's definitive
  property identifier. It sells that layer to estate and letting agents,
  surveyors, mortgage professionals, conveyancers and investors as shareable
  property dashboards, branded reports, Material Information packs, comparables,
  off-market prospecting and market intelligence. In a market with no MLS, Sprift
  occupies the aggregation seam: it does not own listings (Rightmove and Zoopla
  do) and it does not originate records (HM Land Registry and Ordnance Survey
  do), it enriches and resells the join between them. Its API posture is
  genuinely documented but commercially gated. A public, unauthenticated Swagger
  UI at sprift.com/dashboard/api-doc serves a real Swagger 2.0 contract
  (sprift.json, version 1.3.9, 27 paths, 76 definitions) for the v1 API at
  https://sprift.com/dashboard/api/v1, harvested verbatim here — that is the only
  machine-readable contract Sprift publishes. Every operation in it requires a
  SPRIFT-API-KEY header, and the API base returns HTTP 401 to anonymous callers.
  There is no self-serve signup anywhere: /dashboard/register and
  /dashboard/signup both return 404, pricing is not published, and Sprift's own
  knowledge base instructs prospective API users to email Customer Success with
  their company, use case and target systems for review, noting that access "may
  require an additional agreement depending on your subscription". A larger v2
  API family is advertised on the Data and API product page with named endpoint
  paths, webhook alerts and bulk queries, but no contract for it is published and
  no host for it was confirmed. No RESO Web API or Data Dictionary certification,
  no OData service root or $metadata document, and no Universal Property
  Identifier appears anywhere in Sprift's surface — RESO is a North American,
  NAR-driven construct and the UK has no MLS to certify against. The UK's
  standards seam is instead the Open Property Data Association and its Property
  Data Trust Framework, of which Sprift claims founding and accredited
  membership. Sprift publishes no open data of its own; the open UK property
  layer belongs to HM Land Registry and Ordnance Survey, which are among its
  inputs.
