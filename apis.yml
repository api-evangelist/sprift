- aid: sprift:sprift-property-v2-api
  name: Sprift Property V2 API
  description: >-
    The Property V2 tag of the published Sprift v1 contract — eight operations
    that resolve and decompose a property into single-purpose reads rather than
    one large record. GET /property/{uprn}/search returns the raw property
    details and GET /property/{uprn}/propertyid resolves a UPRN to Sprift's
    internal property identifier, which the remaining calls take. From there:
    GET /property/{propertyID}/priceestimate (the only valuation surface in the
    published contract — an estimate on the property record, not a separately
    documented AVM product), /counciltax, /epc for Energy Performance Certificate
    detail, /school for nearby schools, /transport for nearby transport, and
    /streetviewmap for the Google Street View image. Note that this "V2" is a tag
    inside the v1 contract at basePath /dashboard/api/v1; it is not the /api/v2
    family advertised on the Data and API product page.
  humanURL: https://sprift.com/dashboard/api-doc/
  baseURL: https://sprift.com/dashboard/api/v1
