- aid: sprift:sprift-share-api
  name: Sprift Report Share API
  description: >-
    The Share tag of the published Sprift v1 contract — a single POST /share
    operation that produces a shareable link to a Sprift report for a given
    property ID and report type, with the same report type enumeration used by
    the property report call (1 = Market Appraisal Report, 2 = Appointment
    Confirmation, 3 = Key Facts for Buyers, 4 = Property Overview) plus optional
    report pages, an appointment date and a portal version. This is the API
    behind the shareable, white-labelled dashboards and reports that are Sprift's
    core agent-facing product.
  humanURL: https://sprift.com/dashboard/api-doc/
