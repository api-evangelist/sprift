- aid: sprift:sprift-insider-api
  name: Sprift Insider API
  description: >-
    The Insider tag of the published Sprift v1 contract — two operations exposing
    the market intelligence product that sits behind sprift.com/insider. GET
    /insider/{outcode} searches active properties by postcode outcode with an
    optional grouping parameter, and GET /insider/{outcode}/withdrawn returns
    withdrawn properties for the same outcode. This is the market-activity and
    agent-benchmarking surface — live stock, listings and withdrawals by area —
    rather than a single-property lookup.
  humanURL: https://sprift.com/dashboard/api-doc/
  baseURL: https://sprift.com/dashboard/api/v1
