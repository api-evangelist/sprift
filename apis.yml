- aid: sprift:sprift-search-api
  name: Sprift Search API
  description: >-
    The Search tag of the published Sprift v1 contract — three operations for
    finding a property before you can read it. GET /search takes a free-text
    phrase, GET /search/postcode/{postcode} returns addresses for a postcode
    (the UPRN-resolution path most integrations start from), and
    GET /search/myproperties returns the calling account's own saved properties
    and the reports generated against them. All three require the SPRIFT-API-KEY
    header and return HTTP 401 without it.
  humanURL: https://sprift.com/dashboard/api-doc/
