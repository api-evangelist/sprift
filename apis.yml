apis:
- aid: sprift:sprift-property-api
  name: Sprift Property API
  description: >-
    The Property tag of the published Sprift v1 contract — the largest family in
    the harvested Swagger document, with ten operations. POST /property/search
    generates a Sprift property report for a UPRN and is where the report types
    are enumerated in the contract itself (1 = Market Appraisal Report / Desktop
    Research Report, 2 = Appointment Confirmation, 3 = Key Facts For Buyers / Key
    Property Facts, 4 = Property Overview), with report pages selectable by comma
    separated names and an optional PDF flag. GET /property/{propertyID} returns
    the full property detail record. Sub-resources cover Material Information
    (GET /property/{uprn}/materialinformation, split in the schema into physical
    characteristics, financial and tenure, environmental and planning, planning
    applications and immediate proximity — the disclosure set Sprift markets to
    agents as Material Information), comparables (GET /property/{uprn}/{status},
    described as "Comparables (Unified)"), recently sold, currently for sale and
    under offer, map, satellite and street view imagery, Tree Preservation
    Orders, listed buildings, and TV signal availability. Every operation takes a
    required SPRIFT-API-KEY header.
  humanURL: https://sprift.com/dashboard/api-doc/
  baseURL: https://sprift.com/dashboard/api/v1
  tags:
  - Real-Estate
  - United Kingdom
  - Property Data
  - Material Information
  - Comparables
  tags_raw:
  - Real Estate
