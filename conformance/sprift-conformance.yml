summary: >-
  Sprift conforms to almost no cross-cutting API standard. It publishes a Swagger 2.0
  contract (not OpenAPI 3.x), authenticates with a custom header outside the
  securityDefinitions mechanism, uses a proprietary error envelope, and asserts no
  industry data standard in the contract itself. The only standards affiliation it
  claims is associational: accredited membership of the Open Property Data
  Association, whose Property Data Trust Framework the contract does not implement.
