source: live probes of the Sprift web host and API gateway host
summary: >-
  Sprift publishes no /.well-known/ discovery surface. Every RFC-defined document
  was probed on both the primary web/API host (sprift.com, which also serves the
  documented v1 API at basePath /dashboard/api/v1) and the AWS API Gateway host
  (api.sprift.com). Every path on sprift.com returned the Sprift branded 404 page;
  every path on api.sprift.com returned HTTP 403 MissingAuthenticationTokenException,
  which is the AWS API Gateway default for an unmatched route and is not evidence of
  a document. No security.txt, no OIDC discovery, no OAuth authorization-server
  metadata, no api-catalog, no ai-plugin. Recorded as verified absence, not as a gap
  that was left unchecked.
