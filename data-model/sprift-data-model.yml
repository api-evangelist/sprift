source: openapi/sprift-openapi.json
summary: >-
  Entity-relationship graph derived from the harvested Swagger 2.0 contract. Sprift's
  76 definitions are all machine-generated inline_response_* wrappers with no named
  business schemas and almost no $ref reuse between them, so the graph below is
  derived from the identifier fields that actually appear in those schemas and in the
  path parameters — uprn, property_id / propertyID / propID, outcode, postcode,
  agent_id, rmid, epc_certificate_number, application_number — rather than from
  component references. Every entity and field named here exists verbatim in the
  contract.
identifiers:
- name: uprn
  type: integer/number
  role: primary
  description: >-
    Unique Property Reference Number — the UK's definitive property identifier and the
    join key for the whole Sprift product. Path parameter on eight operations and a
    field on the comparables, insider and Material Information schemas.
  appears_in:
  - path parameter on GET /property/{uprn}/tv, /property/{uprn}/{status},
    /property/{uprn}/materialinformation, /property/{uprn}/search, /property/{uprn}/propertyid
  - formData parameter on POST /property/search
  - field on inline_response_200_comparables_item, inline_response_200_insider_item,
    inline_response_200_1_materialinformation, inline_response_200_2_materialinformation_immediate_proximity
- name: propertyID
  aliases:
  - property_id
  - propID
  type: integer
  role: internal surrogate key
  description: >-
    Sprift's own integer property identifier. Distinct from the UPRN and NOT
    interchangeable with it. Ten operations take propertyID as a path parameter and
    one operation exists purely to convert a UPRN into it.
  resolved_by: Property-ID (GET /property/{uprn}/propertyid)
- name: outcode
  type: string
  role: geographic partition key
  description: UK postcode outward code; the unit the Insider market-activity surface is queried by.
- name: postcode
  type: string
  role: address lookup key
  description: Full UK postcode; the input to the address-resolution operation.
- name: agent_id
  type: string
  role: foreign key on a listing
  description: Identifies the marketing agent on an Insider listing record.
- name: rmid
  type: string
  role: external portal key
  description: >-
    Appears on inline_response_200_insider_item alongside a portals object carrying
    rightmove, zoopla and boomin sub-objects — Sprift's link back to the portal
    listings it observes.
