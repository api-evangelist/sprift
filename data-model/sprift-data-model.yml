    A generated report bundles the property record with floodRisk, coastal_erosion,
    estimatedPrice, rentalEstimate, yield, landRegistry, propertyValue,
    poundPerSquareFoot, interior, councilTax, epc, nearby schools, nearby transport,
    broadband speeds, mobile coverage, propertyImages and propertyPolygon.
    reportType 1 = Market Appraisal / Desktop Research, 2 = Appointment Confirmation,
    3 = Key Facts For Buyers, 4 = Property Overview.
