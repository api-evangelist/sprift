  - Login
  - Logout
  path: POST /user/login, GET /user/logout
  purpose: >-
    Not the API authentication path. The contract states: "You do not need to call
    this Endpoint with your API username and password in order to use the API. This
    Endpoint is intended to those who want to add Sprift platform into their
    platforms using an iFrame and let Sprift users to login to Sprift." A partner
    platform authenticates a Sprift end user on the partner's behalf; the call itself
    still requires the SPRIFT-API-KEY header.
