contract_defect: >-
  Sprift publishes three mutually inconsistent statements of its own auth model:
  (1) HTTP Basic, in the Swagger securityDefinitions; (2) a custom SPRIFT-API-KEY
  header, in every operation's parameters; (3) a Bearer token with an
  sk_live_sprift_ prefix, on the Data and API product page. The header parameter is
  the one that matches observed behaviour of the documented v1 host.
