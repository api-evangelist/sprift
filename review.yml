    https://sprift.com/data-and-api links "View API docs" to
    https://sprift.com/dashboard/api-doc/?hsLang=en. That page is a 1,613-byte
    static Swagger UI shell whose bootstrap reads
    url: new URL("sprift.json", document.baseURI).href — so the contract resolves
    to https://sprift.com/dashboard/api-doc/sprift.json, which is served
    anonymously.
