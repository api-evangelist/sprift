generated: '2026-07-26'
method: derived
status: candidate
source: openapi/sprift-openapi.json
summary: >-
  Sprift publishes NO MCP server. No mcp.sprift.com, no entry in the official MCP
  registry, no @modelcontextprotocol package, and no agent/MCP documentation on any
  Sprift surface. The tool list below is an API Evangelist CANDIDATE derived
  one-to-one from the 27 operations in Sprift's published Swagger 2.0 contract — it is
  a design, not a running server, and no endpoint exists to call. Every tool inherits
  its real input contract from the backing operation's parameters in
  openapi/sprift-openapi.json.
server:
  name: sprift
  transport: null
  url: null
  published: false
  probes:
  - url: https://mcp.sprift.com
    result: does not resolve
  - registry: modelcontextprotocol registry
    result: no entry for sprift
authentication:
  scheme: apiKey header SPRIFT-API-KEY
  note: >-
    Any implementation must carry a subscriber's SPRIFT-API-KEY. There is no OAuth,
    so an MCP server for Sprift cannot use the MCP OAuth authorization flow; the key
    would have to be configured server-side or per-session.
  artifact: authentication/sprift-authentication.yml
tools:
