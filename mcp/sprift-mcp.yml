excluded_operations:
- operationId: HomePage
  reason: API root; no agent value.
- operationId: Login
  reason: >-
    iFrame-embed end-user login for partner platforms, not API authentication.
    Exposing it as an agent tool would mean handing an agent a Sprift user's password.
- operationId: Logout
  reason: Companion to the excluded Login operation.
agent_guidance:
  read_before_write: >-
    generate_property_report and share_report are the only write tools and neither is
    replay-safe. See conventions/sprift-conventions.yml and
    agentic-access/sprift-agentic-access.yml.
  required_first_call: >-
    Most property reads take Sprift's internal property ID, not a UPRN. Resolve with
    resolve_uprn_to_property_id first.
