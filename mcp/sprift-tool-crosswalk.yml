summary: >-
  Binding between the candidate MCP tool surface and Sprift's published REST contract.
  Because Sprift publishes no MCP server and no GraphQL surface, there is no vendor
  tool list to reconcile: the crosswalk is a clean one-to-one derivation from the
  27 REST operations, so every binding is high confidence and there are no MCP-only
  tools. What this artifact does record honestly is the divergence that DOES exist at
  Sprift — between the contracted v1 surface and the advertised, uncontracted v2
  family, which no tool can be bound to.
